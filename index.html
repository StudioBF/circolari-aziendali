<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
const newDomain = "circolari.fiorellabernardo.eu";
const oldPathPrefix = "/circolari-aziendali";

let path = window.location.pathname;
if (path.startsWith(oldPathPrefix)) {
    path = path.substring(oldPathPrefix.length);
}
if (!path.startsWith('/')) {
    path = '/' + path;
}

const newUrl = "https://" + newDomain + path + window.location.search + window.location.hash;
window.location.replace(newUrl);
</script>
</head>
<body>
<p>Reindirizzamento in corso... <a href="https://circolari.fiorellabernardo.eu">Clicca qui se non vieni reindirizzato.</a></p>
</body>
</html>
